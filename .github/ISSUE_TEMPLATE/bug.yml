name: Bug report
description: Report a problem with a skill or its documentation.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Skill or reference
      description: Give the skill name and reference path, if applicable.
      placeholder: core-blockchain / references/repositories/...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the incorrect behavior or documentation.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the prompt, command, or source link needed to reproduce it. Remove secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
