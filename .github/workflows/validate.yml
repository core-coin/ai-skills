name: Validate skill

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint GitHub Actions workflow
        uses: docker://rhysd/actionlint:1.7.12
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check skill discovery with the Skills CLI
        run: npx --yes skills@1.8.1 add . --list
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install validation dependency
        run: python -m pip install -r requirements-ci.txt
      - name: Check Python syntax
        run: python -m compileall -q scripts
      - name: Check skill structure and links
        run: python scripts/validate_skill.py
      - name: Check text formatting
        run: python scripts/check_format.py
      - name: Check GitHub configuration
        run: python scripts/validate_github_config.py
